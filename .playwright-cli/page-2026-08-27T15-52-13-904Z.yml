          - generic [ref=e81]:
            - generic [ref=e82]:
              - paragraph [ref=e84]: Tera grew up in a graphic design and marketing household. Her parents did the print work for restaurants, real estate offices, the dentist around the corner. She learned early that a menu board or a logo can change how a place feels to walk into.
              - paragraph [ref=e86]: "Then she spent a decade as a staff data engineer at large companies. Backend systems, the unglamorous stuff that runs in the background. Good practice. After a while she wanted to put those skills somewhere they’d be felt: the bakery, the therapist, the shop on the corner."
              - paragraph [ref=e88]: Small businesses don’t need a launch event. They need a website that loads, a form that works, and someone they can text on a Tuesday when something looks wrong. That’s what this is.
            - complementary [ref=e89]:
              - blockquote [ref=e91]:
                - text: “Big tech taught us how to keep systems alive. Now we get to use that on stuff people will actually feel.”
                - generic [ref=e92]: Tera Earlywine, founder
