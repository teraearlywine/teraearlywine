<aside
    class="consent-banner"
    id="analyticsConsent"
    role="region"
    aria-labelledby="analyticsConsentTitle"
    aria-describedby="analyticsConsentDescription"
    hidden
>
    <div class="consent-banner__content">
        <div>
            <h2 id="analyticsConsentTitle">Privacy choices</h2>
            <p id="analyticsConsentDescription">
                Analytics is not loaded unless you accept, and your choice is saved on this device.
            </p>
        </div>
        <div class="consent-banner__actions">
            <button class="consent-button consent-button--secondary" type="button" data-consent-choice="rejected">
                Reject analytics
            </button>
            <button class="consent-button consent-button--primary" type="button" data-consent-choice="accepted">
                Accept analytics
            </button>
        </div>
    </div>
</aside>
