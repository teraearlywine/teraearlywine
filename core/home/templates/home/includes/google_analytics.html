{% set measurement_id = config.get('GOOGLE_ANALYTICS_MEASUREMENT_ID') %}
{% if measurement_id %}
<script id="analyticsConfig" type="application/json">
    {{ {
        'measurementId': measurement_id,
        'debugMode': config.get('GOOGLE_ANALYTICS_DEBUG', false),
        'pagePath': analytics_page_path | default('/404')
    } | tojson }}
</script>
{% endif %}
