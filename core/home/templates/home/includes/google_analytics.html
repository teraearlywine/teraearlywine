{% set measurement_id = config.get('GOOGLE_ANALYTICS_MEASUREMENT_ID') %}
{% if measurement_id %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ measurement_id | urlencode }}"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', {{ measurement_id | tojson }});
</script>
{% endif %}
